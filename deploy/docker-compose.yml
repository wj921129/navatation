version: '3.8'

services:
  # ─── MySQL ───────────────────────────────────────────────────
  mysql:
    image: mysql:5.7
    container_name: navatation-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Navatation@2026
      MYSQL_DATABASE: navatation
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-sql:/docker-entrypoint-initdb.d   # 自动执行初始化SQL
    ports:
      - "3306:3306"                              # 生产环境可去掉此行，不暴露到公网
    networks:
      - navatation-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pNavatation@2026"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: navatation-redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - navatation-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Spring Boot 后端 ─────────────────────────────────────────
  backend:
    build:
      context: ../navatation-admin
      dockerfile: ../deploy/Dockerfile.backend
    container_name: navatation-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/navatation?useSSL=false&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Navatation@2026
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      APP_UPLOAD_ICON_PATH: /app/data/user_data/icon
      APP_UPLOAD_WALLPAPER_PATH: /app/data/user_data/bg_custom
      APP_UPLOAD_LOCAL_WALLPAPER_PATH: /app/data/sys_data/bg_img
      APP_UPLOAD_SYS_ICON_PATH: /app/data/sys_data/icon
    volumes:
      - app_data:/app/data
      - app_rsa:/app/rsa
      - app_logs:/app/log
    networks:
      - navatation-net

  # ─── Nginx（前端静态文件 + 反向代理）────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: navatation-nginx
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../navatation-web/dist:/usr/share/nginx/html:ro    # 前端构建产物
      - app_data:/app/data:ro                               # 供 Nginx 访问上传的文件
      - nginx_logs:/var/log/nginx
    networks:
      - navatation-net

# ─── 持久化卷 ──────────────────────────────────────────────────
volumes:
  mysql_data:
  redis_data:
  app_data:
  app_rsa:
  app_logs:
  nginx_logs:

# ─── 网络 ─────────────────────────────────────────────────────
networks:
  navatation-net:
    driver: bridge
